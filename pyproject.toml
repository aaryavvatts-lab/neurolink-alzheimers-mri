[project]
name = "neurolink"
version = "0.1.0"
description = "Alzheimer's staging from OASIS-1 brain MRI, with subject-level validation"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "matplotlib>=3.9",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "onnxscript>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurolink"]
